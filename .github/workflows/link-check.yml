name: Weekly External Link Check

on:
  schedule:
    # Tous les lundis à 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'linkedin\.com'
            './**/*.html' './**/*.md'
          fail: false

      - name: Open issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Liens cassés détectés sur le portfolio"
          content-filepath: ./lychee/out.md
          labels: link-check, automated
